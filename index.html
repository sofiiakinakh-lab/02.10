<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --pink:#F4B6CA; --pink-deep:#E98BAB; --pink-soft:#FDEAF1;
  --card:#FDEAF1; --btn-bg:#000000; --btn-ink:#FFFFFF; --veil:rgba(255,255,255,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#FFFFFF; --card:#1A1014; --pink-soft:#2A161E;
    --btn-bg:#F4B6CA; --btn-ink:#000000; --veil:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --card:#1A1014; --pink-soft:#2A161E;
  --btn-bg:#F4B6CA; --btn-ink:#000000; --veil:rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{
  overflow:hidden;
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
.page{max-width:520px;height:100%;margin:0 auto;padding:min(14px,1.8vh) 14px calc(min(96px,13vh) + 8px);display:flex;flex-direction:column}

/* Header */
header{position:relative;flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
h1{
  margin:min(18px,2.2vh) 0 0;font-weight:800;font-size:min(11vw,5.6vh,56px);
  line-height:.88;letter-spacing:-.04em;
}
h1 span{display:block}
h1 span:last-child{
  -webkit-text-stroke:2px var(--ink); color:transparent;
}
.tag{
  width:min(32vw,15.5vh,150px);flex:none;margin-top:-8px;margin-right:2px;
  transform-origin:50% 4%;
  animation:swing 2.4s cubic-bezier(.36,.07,.19,.97) .3s both;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));
}
@keyframes swing{
  0%{transform:rotate(-26deg)}25%{transform:rotate(16deg)}45%{transform:rotate(-9deg)}
  65%{transform:rotate(5deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(6deg)}
}

/* Grid */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:min(12px,1.5vh);margin-top:min(8px,1vh)}
.card{
  background:var(--card);border-radius:26px 26px 22px 22px;
  padding:min(12px,1.4vh) 10px min(10px,1.2vh);display:flex;flex-direction:column;align-items:stretch;min-height:0;
  border:2px solid transparent;
}
.card .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.card .pic img{width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.card h2{
  margin:min(8px,1vh) 2px min(10px,1.2vh);font-size:min(6.4vw,3.3vh,28px);flex:none;font-weight:800;
  letter-spacing:-.02em;line-height:1;text-align:center;
}
.add{
  appearance:none;border:0;cursor:pointer;width:100%;
  flex:none;min-height:min(50px,6.2vh);border-radius:999px;
  background:var(--btn-bg);color:var(--btn-ink);
  font:700 clamp(17px,4.6vw,20px)/1 "Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s, background .25s, color .25s;
}
.add:active{transform:scale(.95)}
.add:focus-visible{outline:3px solid var(--pink-deep);outline-offset:3px}
.add svg{width:20px;height:20px;display:none}
.card.in{border-color:var(--pink)}
.card.in .pic img{opacity:.35}
.card.in .add{background:var(--pink);color:#000}
.card.in .add svg{display:block}

/* Cart button */
.fab{
  position:fixed;z-index:20;right:18px;
  bottom:calc(min(16px,2vh) + env(safe-area-inset-bottom,0px));
  width:min(76px,10.5vh);height:min(76px,10.5vh);border-radius:50%;border:0;cursor:pointer;
  background:#000;color:#F4B6CA;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(0,0,0,.28), 0 0 0 4px var(--bg);
}
.fab svg{width:38px;height:38px}
.fab:focus-visible{outline:3px solid var(--pink-deep);outline-offset:4px}
.badge{
  position:absolute;top:-6px;right:-6px;min-width:34px;height:34px;padding:0 8px;border-radius:999px;
  background:#F4B6CA;color:#000;border:3px solid #000;
  font:800 19px/28px "Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;text-align:center;
  transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1);
}
.badge.on{transform:scale(1)}
.plus{
  position:absolute;left:50%;top:-6px;transform:translateX(-50%);pointer-events:none;
  font:800 26px/1 "Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;color:var(--pink-deep);
  -webkit-text-stroke:1px #000;animation:plus .9s ease-out forwards;
}
@keyframes plus{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.fab.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:none}30%{transform:scale(.86)}100%{transform:none}}
.fab.ready{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:rotate(-10deg)}92%{transform:rotate(8deg)}}

.flyer{position:fixed;z-index:30;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}

/* Overlay */
.veil{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:var(--veil);
  -webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);
  opacity:0;visibility:hidden;transition:opacity .35s, backdrop-filter .35s, -webkit-backdrop-filter .35s, visibility 0s .35s;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
}
.veil.open{opacity:1;visibility:visible;transition:opacity .35s, backdrop-filter .35s, -webkit-backdrop-filter .35s;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.big{
  width:min(86vw,440px);max-height:78vh;object-fit:contain;
  transform:translateX(120vw) rotate(10deg);
  filter:drop-shadow(0 24px 30px rgba(0,0,0,.28));
}
.veil.open .big{animation:roll .9s cubic-bezier(.2,1.25,.4,1) .05s forwards}
@keyframes roll{
  0%{transform:translateX(120vw) rotate(10deg)}
  70%{transform:translateX(-4vw) rotate(-3deg)}
  100%{transform:translateX(0) rotate(0)}
}
.close{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;
  width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.close svg{width:24px;height:24px}
.popper{
  position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:64px;line-height:1;
  opacity:0;transform:scale(.3);
}
.popper.l{left:14px}
.popper.r{right:14px;transform:scale(.3) scaleX(-1)}
.veil.open .popper.l{animation:popL .7s cubic-bezier(.3,1.8,.5,1) 0s forwards}
.veil.open .popper.r{animation:popR .7s cubic-bezier(.3,1.8,.5,1) 0s forwards}
@keyframes popL{to{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes popR{to{opacity:1;transform:scaleX(-1) scale(1) rotate(-8deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  .tag,.fab.ready,.fab.bump{animation:none}
  .veil.open .big{animation:none;transform:none}
}
</style>
</head>

  <div class="popper l" aria-hidden="true">🎉</div>
  <div class="popper r" aria-hidden="true">🎉</div>
</div>
<canvas id="fx"></canvas>

<script>
(function(){
  const cart = document.getElementById('cart');
  const badge = document.getElementById('badge');
  const veil = document.getElementById('veil');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let count = 0;

  document.querySelectorAll('.card').forEach(card=>{
    card.querySelector('.add').addEventListener('click', ()=>{
      if(card.classList.contains('in')) return;
      card.classList.add('in');
      const src = card.querySelector('.pic img');
      const r0 = src.getBoundingClientRect();
      const cr = cart.getBoundingClientRect();
      const endW = 44;
      const endH = endW * (r0.height / r0.width);
      const ex = cr.left + cr.width/2 - endW/2, ey = cr.top + cr.height/2 - endH/2;
      const done = ()=>{
        count++;
        badge.textContent = count; badge.classList.add('on');
        badge.style.transform='scale(1.5)'; setTimeout(()=>badge.style.transform='',180);
        const p = document.createElement('span'); p.className='plus'; p.textContent='+1';
        cart.appendChild(p); setTimeout(()=>p.remove(),950);
        cart.classList.remove('bump','ready'); void cart.offsetWidth; cart.classList.add('bump');
        setTimeout(()=>{cart.classList.remove('bump'); cart.classList.add('ready');},520);
        if(navigator.vibrate) try{navigator.vibrate(18)}catch(e){}
      };
      if(reduce){ done(); return; }
      const fly = document.createElement('img');
      fly.src = src.src; fly.className = 'flyer';
      fly.style.left = r0.left+'px'; fly.style.top = r0.top+'px';
      fly.style.width = r0.width+'px'; fly.style.transformOrigin = '0 0';
      document.body.appendChild(fly);
      const sc = endW / r0.width, dx = ex - r0.left, dy = ey - r0.top;
      const peak = -Math.max(70, r0.height*0.6);
      fly.animate([
        {transform:'translate(0,0) scale(1) rotate(0deg)', opacity:1},
        {transform:`translate(${dx*0.3}px,${peak}px) scale(${0.75+sc*0.3}) rotate(-14deg)`, opacity:1, offset:.32, easing:'cubic-bezier(.5,0,.9,.6)'},
        {transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(20deg)`, opacity:1, offset:.92},
        {transform:`translate(${dx}px,${dy}px) scale(${sc*0.4}) rotate(20deg)`, opacity:0}
      ], {duration:900, fill:'forwards'}).onfinish = ()=>{ fly.remove(); done(); };
    });
  });

  // ===== Built-in confetti + fireworks engine =====
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W=0,H=0,DPR=1;
  function size(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  size(); addEventListener('resize', size);
  const COLORS=['#F4B6CA','#E98BAB','#FF6FA3','#000000','#FFFFFF','#FDEAF1','#F9D3DF'];
  const pick=a=>a[(Math.random()*a.length)|0];
  let parts=[], rockets=[], running=false, timers=[];

  function confetti(x,y,n,angle,spread,speed){
    for(let i=0;i<n;i++){
      const a=(angle+(Math.random()-.5)*spread)*Math.PI/180, v=speed*(.45+Math.random()*.75);
      parts.push({k:'c',x,y,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,w:7+Math.random()*7,h:4+Math.random()*6,
        r:Math.random()*6.28,vr:(Math.random()-.5)*.35,t:Math.random()*6.28,vt:.08+Math.random()*.12,
        c:pick(COLORS),life:1,decay:.0035+Math.random()*.003,round:Math.random()<.25});
    }
  }
  function rain(n){ for(let i=0;i<n;i++) parts.push({k:'c',x:Math.random()*W,y:-20-Math.random()*60,
      vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:7+Math.random()*7,h:4+Math.random()*6,
      r:Math.random()*6.28,vr:(Math.random()-.5)*.3,t:Math.random()*6.28,vt:.06+Math.random()*.1,
      c:pick(COLORS),life:1,decay:.002,round:Math.random()<.25}); }
  function rocket(){
    const x=W*(.12+Math.random()*.76);
    rockets.push({x,y:H+10,vx:(Math.random()-.5)*1.5,vy:-(H*.018+6+Math.random()*4),ty:H*(.12+Math.random()*.38),c:pick(['#E98BAB','#FF6FA3','#000000','#F4B6CA'])});
  }
  function explode(x,y,c){
    const n=70+(Math.random()*40|0), sp=4+Math.random()*3;
    for(let i=0;i<n;i++){
      const a=i/n*6.283+Math.random()*.1, v=sp*(.6+Math.random()*.5);
      parts.push({k:'s',x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:Math.random()<.7?c:pick(COLORS),
        life:1,decay:.012+Math.random()*.01,sz:2+Math.random()*2});
    }
    confetti(x,y,25,90,360,9);
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i]; r.x+=r.vx; r.y+=r.vy; r.vy+=.18;
      ctx.strokeStyle=r.c; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-r.vx*3,r.y-r.vy*3); ctx.stroke();
      if(r.y<=r.ty||r.vy>=-1){ explode(r.x,r.y,r.c); rockets.splice(i,1); }
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      if(p.k==='c'){
        p.vx*=.985; p.vy=p.vy*.985+.16; p.x+=p.vx+Math.sin(p.t)*.6; p.y+=p.vy; p.r+=p.vr; p.t+=p.vt; p.life-=p.decay;
        ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.scale(1,Math.cos(p.t)); ctx.fillStyle=p.c;
        if(p.round){ctx.beginPath();ctx.arc(0,0,p.w/2.2,0,6.283);ctx.fill();}
        else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        if(p.c==='#FFFFFF'){ctx.strokeStyle='#F4B6CA';ctx.lineWidth=1;ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);}
        ctx.restore();
        if(p.life<=0||p.y>H+40) parts.splice(i,1);
      } else {
        p.px=p.x; p.py=p.y; p.vx*=.96; p.vy=p.vy*.96+.07; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
        ctx.globalAlpha=Math.max(0,p.life); ctx.strokeStyle=p.c; ctx.lineWidth=p.sz; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(p.px-p.vx*2,p.py-p.vy*2); ctx.lineTo(p.x,p.y); ctx.stroke();
        ctx.globalAlpha=1;
        if(p.life<=0) parts.splice(i,1);
      }
    }
    if(parts.length||rockets.length||running) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,W,H);
  }
  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
  function party(){
    if(reduce) return;
    stopFx(); running=true; requestAnimationFrame(frame);
    // poppers fire immediately from both bottom corners
    const pop=()=>{ confetti(30,H-60,140,62,40,24); confetti(W-30,H-60,140,118,40,24); };
    pop(); later(pop,350); later(pop,800);
    // screen-wide rain + fireworks right away
    for(let i=0;i<24;i++) later(()=>rain(26),i*150);
    for(let i=0;i<14;i++) later(rocket,i*260);
    later(()=>{ confetti(W/2,H*.4,220,90,360,16); },600);
    later(()=>{ running=false; },3800);
  }
  function stopFx(){ timers.forEach(clearTimeout); timers=[]; parts=[]; rockets=[]; running=false; ctx.clearRect(0,0,W,H); }

  function open(){
    veil.classList.add('open'); veil.setAttribute('aria-hidden','false');
    const big = veil.querySelector('.big');
    big.style.animation='none'; void big.offsetWidth; big.style.animation='';
    veil.querySelectorAll('.popper').forEach(p=>{p.style.animation='none'; void p.offsetWidth; p.style.animation='';});
    party();
  }
  function close(){
    veil.classList.remove('open'); veil.setAttribute('aria-hidden','true');
    stopFx();
  }
  cart.addEventListener('click', open);
  veil.addEventListener('click', e=>{ if(e.target===veil || e.target.closest('.close')) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
})();
</script>
